<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Real-time weather dashboard using a public weather API.">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="weather-app">

        <header>

            <h1>🌦️ Weather Dashboard</h1>

            <p>
                Search for a city to see its current weather.
            </p>

        </header>


        <!-- Search Section -->

        <section
            class="search-section"
            aria-labelledby="search-heading">

            <h2 id="search-heading">
                Search Weather
            </h2>

            <form id="weather-form">

                <label for="city-input">
                    Enter City Name
                </label>

                <div class="search-row">

                    <input
                        type="text"
                        id="city-input"
                        placeholder="e.g. Bengaluru"
                        autocomplete="off"
                        required>

                    <button type="submit">
                        Search
                    </button>

                </div>

            </form>

        </section>


        <!-- Loading Message -->

        <p
            id="loading-message"
            class="status-message"
            aria-live="polite"
            hidden>

            Loading weather data...

        </p>


        <!-- Error Message -->

        <p
            id="error-message"
            class="error-message"
            aria-live="assertive"
            hidden>

        </p>


        <!-- Weather Dashboard -->

        <section
            id="weather-dashboard"
            class="weather-dashboard"
            aria-labelledby="weather-heading"
            hidden>

            <h2 id="weather-heading">
                Weather Information
            </h2>


            <!-- Location -->

            <div class="location-card">

                <h3 id="location-name">
                    City
                </h3>

                <p id="location-country">
                    Country
                </p>

            </div>


            <!-- Weather Cards -->

            <div class="weather-grid">

                <article class="weather-card">

                    <span class="weather-icon">
                        🌡️
                    </span>

                    <h3>
                        Temperature
                    </h3>

                    <p id="temperature">
                        --
                    </p>

                </article>


                <article class="weather-card">

                    <span class="weather-icon">
                        💧
                    </span>

                    <h3>
                        Humidity
                    </h3>

                    <p id="humidity">
                        --
                    </p>

                </article>


                <article class="weather-card">

                    <span class="weather-icon">
                        💨
                    </span>

                    <h3>
                        Wind Speed
                    </h3>

                    <p id="wind-speed">
                        --
                    </p>

                </article>

            </div>

        </section>


        <footer>

            <p>
                Weather data provided by Open-Meteo.
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
